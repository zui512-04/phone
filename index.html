<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no,
               viewport-fit=cover">

<meta name="theme-color" content="#080910">

<title>Virtual OS V7</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#05060a;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        sans-serif;
    color:#fff;
}

button,
input{
    font:inherit;
}

button{
    border:0;
    outline:0;
}

body{
    display:flex;
    align-items:center;
    justify-content:center;
}

/* =========================================================
   PHONE
========================================================= */

.phone{
    position:relative;
    width:390px;
    height:844px;
    max-width:100vw;
    max-height:100vh;
    overflow:hidden;
    background:#080910;
}

/* Desktop phone frame */

@media(min-width:600px){

    body{
        background:
            radial-gradient(
                circle at center,
                #202331 0,
                #090a0f 45%,
                #030407 100%
            );
    }

    .phone{
        border-radius:42px;
        box-shadow:
            0 30px 100px rgba(0,0,0,.7),
            inset 0 0 0 2px #343640;
    }
}

/* =========================================================
   WALLPAPER
========================================================= */

.wallpaper{
    position:absolute;
    inset:0;
    z-index:0;

    background:
        radial-gradient(
            circle at 20% 20%,
            rgba(113,83,255,.4),
            transparent 35%
        ),
        radial-gradient(
            circle at 80% 70%,
            rgba(0,198,255,.25),
            transparent 35%
        ),
        linear-gradient(
            145deg,
            #090b1c,
            #10132c 45%,
            #05060d
        );
}

.wallpaper::before{
    content:"";
    position:absolute;
    inset:0;

    background-image:
        radial-gradient(
            white 1px,
            transparent 1px
        );

    background-size:70px 70px;
    opacity:.16;
}

.wallpaper.purple{
    background:
        radial-gradient(
            circle at 30% 30%,
            rgba(180,90,255,.5),
            transparent 35%
        ),
        linear-gradient(
            145deg,
            #10091c,
            #26113b,
            #07050d
        );
}

.wallpaper.blue{
    background:
        radial-gradient(
            circle at 70% 30%,
            rgba(0,190,255,.45),
            transparent 35%
        ),
        linear-gradient(
            145deg,
            #06131e,
            #09283d,
            #05070c
        );
}

.wallpaper.red{
    background:
        radial-gradient(
            circle at 30% 30%,
            rgba(255,60,100,.35),
            transparent 35%
        ),
        linear-gradient(
            145deg,
            #1b060d,
            #360c1b,
            #070408
        );
}

/* =========================================================
   SYSTEM LAYER
========================================================= */

.system-layer{
    position:absolute;
    inset:0;
    z-index:100;
    pointer-events:none;
}

.system-layer > *{
    pointer-events:auto;
}

/* =========================================================
   STATUS BAR
========================================================= */

.status-bar{
    position:absolute;
    top:0;
    left:0;
    right:0;

    height:34px;

    padding:
        env(safe-area-inset-top, 0px)
        15px
        0;

    display:flex;
    align-items:flex-end;
    justify-content:space-between;

    z-index:500;

    font-size:12px;
    font-weight:600;

    color:#fff;

    pointer-events:none;
}

.status-left,
.status-right{
    display:flex;
    align-items:center;
    gap:7px;
    height:25px;
}

.status-icon{
    opacity:.95;
}

.battery-icon{
    width:21px;
    height:10px;
    border:1.5px solid rgba(255,255,255,.9);
    border-radius:3px;
    padding:1px;
    position:relative;
}

.battery-icon::after{
    content:"";
    position:absolute;
    right:-4px;
    top:2px;
    width:2px;
    height:5px;
    border-radius:1px;
    background:#fff;
}

.battery-fill{
    width:70%;
    height:100%;
    border-radius:1px;
    background:#fff;
}

/* =========================================================
   BOOT SCREEN
========================================================= */

.boot-screen{
    position:absolute;
    inset:0;
    z-index:1000;

    background:#05060a;

    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;

    transition:
        opacity .5s,
        visibility .5s;
}

.boot-screen.hide{
    opacity:0;
    visibility:hidden;
}

.boot-logo{
    width:78px;
    height:78px;

    border-radius:24px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:32px;
    font-weight:800;

    background:
        linear-gradient(
            135deg,
            #7d5cff,
            #20c9ff
        );

    box-shadow:
        0 0 50px rgba(104,92,255,.5);
}

.boot-name{
    margin-top:22px;
    font-size:20px;
    font-weight:700;
}

.boot-loading{
    width:130px;
    height:3px;
    margin-top:22px;
    border-radius:20px;
    background:#20222b;
    overflow:hidden;
}

.boot-loading::after{
    content:"";
    display:block;
    width:45%;
    height:100%;
    background:#fff;
    animation:loading 1.6s infinite;
}

@keyframes loading{

    0%{
        transform:translateX(-130px);
    }

    100%{
        transform:translateX(300px);
    }

}

/* =========================================================
   LOCK SCREEN
========================================================= */

.lock-screen{
    position:absolute;
    inset:0;
    z-index:900;

    display:flex;
    flex-direction:column;

    align-items:center;

    padding-top:80px;

    transition:
        transform .5s cubic-bezier(.2,.8,.2,1),
        opacity .4s;
}

.lock-screen.unlocking{
    transform:translateY(-100%);
    opacity:0;
}

.lock-top{
    text-align:center;
}

.lock-time{
    font-size:68px;
    font-weight:300;
    letter-spacing:-3px;
}

.lock-date{
    margin-top:5px;
    font-size:15px;
    opacity:.85;
}

.lock-weather{
    margin-top:15px;
    font-size:14px;
    opacity:.85;
}

.lock-notifications{
    width:calc(100% - 30px);
    margin-top:38px;
}

.lock-notification{
    display:flex;
    align-items:center;

    padding:13px 15px;

    margin-bottom:8px;

    border-radius:17px;

    background:
        rgba(20,22,32,.65);

    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);

    border:1px solid rgba(255,255,255,.07);
}

.lock-notification-icon{
    width:38px;
    height:38px;

    border-radius:12px;

    display:flex;
    align-items:center;
    justify-content:center;

    margin-right:11px;

    background:
        linear-gradient(
            135deg,
            #745dff,
            #24c5ff
        );
}

.lock-notification-text{
    flex:1;
}

.lock-notification-title{
    font-size:13px;
    font-weight:700;
}

.lock-notification-body{
    margin-top:2px;
    font-size:12px;
    opacity:.72;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.lock-bottom{
    position:absolute;
    bottom:35px;
    left:0;
    right:0;

    text-align:center;
}

.lock-hint{
    font-size:12px;
    opacity:.45;
}

.lock-camera,
.lock-flash{
    position:absolute;
    bottom:32px;

    width:48px;
    height:48px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    background:rgba(255,255,255,.13);
    backdrop-filter:blur(10px);
}

.lock-camera{
    left:24px;
}

.lock-flash{
    right:24px;
}

/* =========================================================
   PIN
========================================================= */

.pin-screen{
    position:absolute;
    inset:0;
    z-index:950;

    display:none;
    flex-direction:column;
    align-items:center;

    padding-top:105px;

    background:
        rgba(4,5,10,.55);

    backdrop-filter:blur(25px);
}

.pin-screen.show{
    display:flex;
}

.pin-title{
    font-size:18px;
    font-weight:700;
}

.pin-subtitle{
    margin-top:7px;
    font-size:12px;
    opacity:.55;
}

.pin-dots{
    display:flex;
    gap:12px;
    margin-top:28px;
}

.pin-dot{
    width:10px;
    height:10px;

    border-radius:50%;

    border:1px solid rgba(255,255,255,.7);
}

.pin-dot.active{
    background:#fff;
}

.pin-keypad{
    width:270px;
    margin-top:40px;

    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
}

.pin-key{
    height:60px;

    border-radius:50%;

    color:#fff;
    background:rgba(255,255,255,.1);

    font-size:21px;
}

.pin-key:active{
    background:rgba(255,255,255,.25);
}

.pin-error{
    height:20px;
    margin-top:10px;
    font-size:12px;
    color:#ff7186;
}

/* =========================================================
   HOME
========================================================= */

.home-screen{
    position:absolute;
    inset:0;

    padding-top:36px;
    padding-bottom:92px;

    overflow:hidden;

    z-index:20;

    transition:
        transform .35s,
        opacity .3s;
}

.home-pages{
    width:100%;
    height:100%;

    display:flex;

    transition:
        transform .35s cubic-bezier(.2,.8,.2,1);
}

.home-page{
    min-width:100%;
    height:100%;

    padding:
        12px
        17px
        0;
}

/* =========================================================
   WIDGET
========================================================= */

.home-widget{
    width:100%;

    padding:18px;

    border-radius:25px;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.13),
            rgba(255,255,255,.05)
        );

    border:
        1px solid rgba(255,255,255,.08);

    backdrop-filter:blur(18px);
}

.widget-top{
    display:flex;
    justify-content:space-between;
}

.widget-time{
    font-size:29px;
    font-weight:500;
}

.widget-weather{
    text-align:right;
    font-size:13px;
    opacity:.8;
}

.widget-bottom{
    display:flex;
    justify-content:space-between;

    margin-top:15px;

    font-size:12px;
    opacity:.7;
}

/* =========================================================
   APP GRID
========================================================= */

.app-grid{
    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:
        21px
        12px;

    margin-top:25px;
}

.app-item{
    min-width:0;

    display:flex;
    flex-direction:column;
    align-items:center;

    position:relative;
}

.app-icon{
    width:59px;
    height:59px;

    border-radius:17px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:27px;

    box-shadow:
        0 8px 20px rgba(0,0,0,.22);

    transition:
        transform .15s;
}

.app-item:active .app-icon{
    transform:scale(.9);
}

.app-name{
    width:72px;

    margin-top:7px;

    text-align:center;

    font-size:11px;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.app-badge{
    position:absolute;

    top:-4px;
    right:9px;

    min-width:18px;
    height:18px;

    padding:0 5px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:20px;

    background:#ff3b58;
    color:#fff;

    font-size:10px;
    font-weight:700;

    border:2px solid #11131c;
}

/* =========================================================
   DOCK
========================================================= */

.dock{
    position:absolute;

    left:14px;
    right:14px;
    bottom:14px;

    height:73px;

    display:grid;
    grid-template-columns:repeat(4,1fr);

    align-items:center;

    padding:7px;

    border-radius:27px;

    background:
        rgba(255,255,255,.1);

    border:
        1px solid rgba(255,255,255,.08);

    backdrop-filter:blur(25px);
}

.dock .app-name{
    display:none;
}

/* =========================================================
   PAGE DOTS
========================================================= */

.page-dots{
    position:absolute;

    bottom:99px;
    left:0;
    right:0;

    display:flex;
    justify-content:center;

    gap:6px;
}

.page-dot{
    width:6px;
    height:6px;

    border-radius:50%;

    background:rgba(255,255,255,.3);
}

.page-dot.active{
    width:18px;
    border-radius:10px;
    background:#fff;
}

/* =========================================================
   APP COLORS
========================================================= */

.c-message{
    background:
        linear-gradient(135deg,#19c98a,#0c8c75);
}

.c-social{
    background:
        linear-gradient(135deg,#ff5d91,#765cff);
}

.c-phone{
    background:
        linear-gradient(135deg,#42e07c,#16a05c);
}

.c-contact{
    background:
        linear-gradient(135deg,#48a7ff,#4169e1);
}

.c-camera{
    background:
        linear-gradient(135deg,#555,#15151a);
}

.c-gallery{
    background:
        linear-gradient(135deg,#ff9d42,#ff4d7e);
}

.c-settings{
    background:
        linear-gradient(135deg,#747b8e,#343945);
}

.c-store{
    background:
        linear-gradient(135deg,#5e9bff,#705cff);
}

.c-notes{
    background:
        linear-gradient(135deg,#ffd84c,#ffb300);
}

.c-calc{
    background:
        linear-gradient(135deg,#4e566a,#252a36);
}

.c-weather{
    background:
        linear-gradient(135deg,#40baff,#2874ff);
}

.c-game{
    background:
        linear-gradient(135deg,#ff5c73,#a33cff);
}

.c-network{
    background:
        linear-gradient(135deg,#20c8ff,#3069ff);
}

/* =========================================================
   APP CONTAINER
========================================================= */

.app-layer{
    position:absolute;
    inset:0;

    z-index:200;

    display:none;

    flex-direction:column;

    background:
        rgba(8,9,15,.97);

    animation:appOpen .28s ease;
}

.app-layer.show{
    display:flex;
}

@keyframes appOpen{

    from{
        opacity:0;
        transform:scale(.96);
    }

    to{
        opacity:1;
        transform:scale(1);
    }

}

.app-header{
    height:66px;

    padding:
        31px 17px 0;

    display:flex;
    align-items:center;

    flex-shrink:0;

    border-bottom:
        1px solid rgba(255,255,255,.05);
}

.app-back{
    width:36px;
    height:32px;

    display:flex;
    align-items:center;
    justify-content:flex-start;

    background:none;
    color:#fff;

    font-size:26px;
}

.app-title{
    flex:1;

    font-size:18px;
    font-weight:700;

    margin-left:5px;
}

.app-header-action{
    background:none;
    color:#fff;

    font-size:21px;
}

.app-content{
    flex:1;
    overflow:auto;

    padding:16px;

    -webkit-overflow-scrolling:touch;
}

.app-content::-webkit-scrollbar{
    display:none;
}

/* =========================================================
   BOTTOM NAV
========================================================= */

.bottom-nav{
    height:67px;

    flex-shrink:0;

    display:grid;
    grid-template-columns:repeat(3,1fr);

    border-top:
        1px solid rgba(255,255,255,.06);

    background:
        rgba(10,11,18,.9);

    padding-bottom:
        env(safe-area-inset-bottom,0);
}

.bottom-nav button{
    color:rgba(255,255,255,.55);
    background:none;
    font-size:12px;
}

.bottom-nav button:first-child{
    color:#fff;
}

/* =========================================================
   NOTIFICATION SHADE
========================================================= */

.shade{
    position:absolute;
    inset:0;

    z-index:700;

    display:none;

    background:
        rgba(7,8,14,.72);

    backdrop-filter:blur(25px);

    padding:
        50px 15px 15px;

    overflow:auto;
}

.shade.show{
    display:block;
    animation:shadeOpen .25s ease;
}

@keyframes shadeOpen{

    from{
        opacity:0;
        transform:translateY(-25px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

.shade-time{
    font-size:40px;
    font-weight:300;
}

.shade-date{
    margin-top:2px;
    opacity:.6;
    font-size:13px;
}

.quick-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;

    margin-top:22px;
}

.quick-button{
    min-height:74px;

    border-radius:20px;

    padding:12px;

    text-align:left;

    color:#fff;

    background:
        rgba(255,255,255,.09);

    border:
        1px solid rgba(255,255,255,.05);
}

.quick-button.active{
    background:
        linear-gradient(
            135deg,
            #6d5cff,
            #378fff
        );
}

.quick-symbol{
    font-size:21px;
}

.quick-label{
    margin-top:7px;
    font-size:12px;
}

.slider-box{
    margin-top:10px;

    padding:15px;

    border-radius:20px;

    background:
        rgba(255,255,255,.08);
}

.slider-title{
    display:flex;
    justify-content:space-between;

    font-size:12px;
    opacity:.7;

    margin-bottom:9px;
}

input[type=range]{
    width:100%;
    accent-color:#fff;
}

.shade-title{
    margin-top:23px;
    margin-bottom:10px;

    font-size:15px;
    font-weight:700;
}

.notification-card{
    display:flex;

    padding:13px;

    margin-bottom:8px;

    border-radius:17px;

    background:
        rgba(255,255,255,.08);
}

.notification-card-icon{
    width:39px;
    height:39px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:12px;

    margin-right:10px;

    background:
        linear-gradient(
            135deg,
            #735dff,
            #22c8ff
        );
}

.notification-card-main{
    flex:1;
}

.notification-card-title{
    font-size:13px;
    font-weight:700;
}

.notification-card-body{
    margin-top:3px;
    font-size:12px;
    opacity:.65;
}

/* =========================================================
   RECENT APPS
========================================================= */

.recent-layer{
    position:absolute;
    inset:0;

    z-index:600;

    display:none;

    background:
        rgba(5,6,11,.85);

    backdrop-filter:blur(25px);

    padding:
        55px 15px 90px;

    overflow:auto;
}

.recent-layer.show{
    display:block;
    animation:recentOpen .25s ease;
}

@keyframes recentOpen{

    from{
        opacity:0;
        transform:translateY(40px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

.recent-title{
    font-size:25px;
    font-weight:700;
}

.recent-subtitle{
    margin-top:5px;
    font-size:12px;
    opacity:.45;
}

.recent-list{
    margin-top:22px;
}

.recent-card{
    position:relative;

    height:145px;

    margin-bottom:15px;

    padding:17px;

    border-radius:25px;

    overflow:hidden;

    background:
        linear-gradient(
            135deg,
            #191b28,
            #0d0e15
        );

    border:
        1px solid rgba(255,255,255,.07);

    box-shadow:
        0 15px 30px rgba(0,0,0,.25);
}

.recent-card-name{
    font-size:17px;
    font-weight:700;
}

.recent-card-icon{
    font-size:32px;
    margin-top:24px;
}

.recent-close{
    position:absolute;

    top:13px;
    right:13px;

    width:30px;
    height:30px;

    border-radius:50%;

    color:#fff;
    background:rgba(255,255,255,.1);
}

/* =========================================================
   GENERIC UI
========================================================= */

.card{
    padding:16px;

    border-radius:20px;

    background:
        rgba(255,255,255,.07);

    border:
        1px solid rgba(255,255,255,.06);

    margin-bottom:12px;
}

.row{
    display:flex;
    align-items:center;
}

.row-between{
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.avatar{
    width:45px;
    height:45px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:
        linear-gradient(
            135deg,
            #715dff,
            #25c5ff
        );

    font-weight:700;
}

.muted{
    color:rgba(255,255,255,.5);
}

.small{
    font-size:12px;
}

.primary-btn{
    width:100%;

    padding:14px;

    border-radius:15px;

    color:#fff;

    background:
        linear-gradient(
            135deg,
            #715dff,
            #388dff
        );

    font-weight:700;
}

.danger-btn{
    width:100%;

    padding:14px;

    border-radius:15px;

    color:#fff;

    background:#bd344b;

    font-weight:700;
}

.text-input{
    width:100%;

    padding:14px;

    border-radius:15px;

    outline:0;

    color:#fff;

    background:
        rgba(255,255,255,.08);

    border:
        1px solid rgba(255,255,255,.08);
}

/* =========================================================
   MESSAGES
========================================================= */

.chat-item{
    display:flex;
    align-items:center;

    padding:14px 4px;

    border-bottom:
        1px solid rgba(255,255,255,.06);
}

.chat-info{

/* ---------------------------------------------------------
   LOAD / SAVE
--------------------------------------------------------- */

function loadData(){

    try{

        const saved =
            localStorage.getItem(
                "virtualOSV7"
            );

        if(saved){

            const parsed =
                JSON.parse(saved);

            return {
                ...DEFAULT_DATA,
                ...parsed
            };

        }

    }catch(e){

        console.log(e);

    }

    return JSON.parse(
        JSON.stringify(DEFAULT_DATA)
    );

}


function saveData(){

    try{

        localStorage.setItem(
            "virtualOSV7",
            JSON.stringify(data)
        );

    }catch(e){

        console.log(e);

    }

}


/* =========================================================
   TIME
========================================================= */

function updateTime(){

    const now =
        new Date();

    const hours =
        String(
            now.getHours()
        ).padStart(2,"0");

    const minutes =
        String(
            now.getMinutes()
        ).padStart(2,"0");

    const time =
        `${hours}:${minutes}`;

    document
        .getElementById("statusTime")
        .textContent = time;

    document
        .getElementById("lockTime")
        .textContent = time;

    document
        .getElementById("widgetTime")
        .textContent = time;

    document
        .getElementById("shadeTime")
        .textContent = time;

    const weekdays = [
        "星期日",
        "星期一",
        "星期二",
        "星期三",
        "星期四",
        "星期五",
        "星期六"
    ];

    const weekday =
        weekdays[now.getDay()];

    const month =
        now.getMonth()+1;

    const day =
        now.getDate();

    const dateText =
        `${weekday}，${month}月${day}日`;

    document
        .getElementById("lockDate")
        .textContent =
        dateText;

    document
        .getElementById("widgetDate")
        .textContent =
        `${weekday} · ${month}/${day}`;

    document
        .getElementById("shadeDate")
        .textContent =
        dateText;

}


/* =========================================================

    const battery =
        Math.max(
            0,
            Math.min(
                100,
                data.battery
            )
        );

    document
        .getElementById("batteryText")
        .textContent =
        Math.round(battery)+"%";

    document
        .getElementById("batteryFill")
        .style.width =

        data.wifi && !data.airplane

/* =========================================================
   HOME
========================================================= */

function renderHome(){

    const grid1 =
        document.getElementById(
            "appGrid1"
        );

    const grid2 =
        document.getElementById(
            "appGrid2"
        );

    const dock =
        document.getElementById(
            "dock"
        );

    grid1.innerHTML = "";

    grid2.innerHTML = "";

    dock.innerHTML = "";


    const apps =
        data.installedApps
        .filter(
            id => APPS[id]
        );


    const page1 =
        apps.slice(0,8);

    const page2 =
        apps.slice(8);


    page1.forEach(
        id =>
        createAppIcon(
            id,
            grid1
        )
    );

    page2.forEach(
        id =>
        createAppIcon(
            id,
            grid2
        )
    );


    const dockApps = [
        "phone",
        "messages",
        "camera",
        "settings"
    ];

    dockApps.forEach(
        id => {

            if(
                data.installedApps
                    .includes(id)
            ){

                createAppIcon(
                    id,
                    dock,
                    true
                );

            }

        }
    );

}


function createAppIcon(
    id,
    container,
    isDock=false
){

    const app =
        APPS[id];

    if(!app)
        return;


    const item =
        document.createElement(
            "div"
        );

    item.className =
        "app-item";


    const icon =
        document.createElement(
            "div"
        );

    icon.className =
        "app-icon "+
        app.color;

    icon.textContent =
        app.icon;


    const name =
        document.createElement(
            "div"
        );

    name.className =
        "app-name";

    name.textContent =
        app.name;


    item.appendChild(icon);

    if(!isDock){

        item.appendChild(name);

    }


    const unread =
        getUnreadCount(id);

    if(unread > 0){

        const badge =
            document.createElement(
                "div"
            );

        badge.className =
            "app-badge";

        badge.textContent =
            unread > 99
                ? "99+"
                : unread;

        item.appendChild(badge);

    }


    item.onclick = () => {

        if(editingHome){

            showToast(
                "長按圖示可進入編輯模式"
            );

            return;

        }

        openApp(id);

    };


    let pressTimer;

    item.addEventListener(
        "touchstart",
        () => {

            pressTimer =
                setTimeout(
                    () => {

                        enterEditMode();

                    },
                    650
                );

        }
    );

    item.addEventListener(
        "touchend",
        () => {

            clearTimeout(
                pressTimer
            );

        }
    );


    container.appendChild(item);

}


function getUnreadCount(id){

    if(id === "messages"){

        return data.notifications.filter(
            n =>
                n.title === "訊息"
        ).length;

    }

    return 0;

}


function updateHomePage(){

    const pages =
        document.getElementById(
            "homePages"
        );

    pages.style.transform =
        `translateX(-${currentPage*100}%)`;


    const dots =
        document.querySelectorAll(
            ".page-dot"
        );

    dots.forEach(
        (dot,index) => {

            dot.classList.toggle(
                "active",
                index === currentPage
            );

        }
    );

}


/* =========================================================
   APP OPEN
========================================================= */

function openApp(
    id,
    subPage=null
){

    if(!APPS[id])
        return;


    closeShade();

    closeRecent();


    if(currentApp !== id){

        if(currentApp){

            navigationStack.push(
                {
                    app:currentApp,
                    subPage:null
                }
            );

        }

        currentApp = id;

        currentChat = null;

        if(
            !recentApps.includes(id)
        ){

            recentApps.unshift(id);

        }else{

            recentApps =
                recentApps.filter(
                    app => app !== id
                );

            recentApps.unshift(id);

        }

        recentApps =
            recentApps.slice(0,6);

    }


    document
        .getElementById(
            "homeScreen"
        )
        .style.display =
        "none";

    const layer =
        document.getElementById(
            "appLayer"
        );

    layer.classList.add("show");

    document
        .getElementById(
            "appTitle"
        )
        .textContent =
        APPS[id].name;

    renderApp(
        id,
        subPage
    );

}


/* =========================================================
   RENDER APP
========================================================= */

function renderApp(
    id,
    subPage=null
){

    const content =
        document.getElementById(
            "appContent"
        );

    const action =
        document.getElementById(
            "appHeaderAction"
        );

    action.innerHTML = "";

    content.innerHTML = "";

    switch(id){

        case "messages":
            renderMessages(
                content,
                subPage
            );
            break;

        case "social":
            renderSocial(
                content
            );
            break;

        case "phone":
            renderPhone(
                content
            );
            break;

        case "contacts":
            renderContacts(
                content
            );
            break;

        case "camera":
            renderCamera(
                content
            );
            break;

        case "gallery":
            renderGallery(
                content
            );
            break;

        case "settings":
            renderSettings(
                content
            );
            break;

        case "store":
            renderStore(
                content
            );
            break;

        case "notes":
            renderNotes(
                content
            );
            break;

        case "calculator":
            renderCalculator(
                content
            );
            break;

        case "weather":
            renderWeather(
                content
            );
            break;

        case "game":
            renderGame(
                content
            );
            break;

        case "network":
            renderNetwork(
                content
            );
            break;

    }

}


/* =========================================================
   BACK / HOME
========================================================= */

function goBack(){

    if(currentApp === "messages"){

        if(currentChat){

            currentChat = null;

            renderApp(
                "messages"
            );

            return;

        }

    }


    if(
        navigationStack.length > 0
    ){

        const previous =
            navigationStack.pop();

        currentApp =
            previous.app;

        currentChat =
            previous.subPage === "chat"
                ? previous.chat
                : null;

        renderApp(
            currentApp,
            previous.subPage
        );

        return;

    }


    goHome();

}


function goHome(){

    stopCamera();

    currentApp = null;

    currentChat = null;

    navigationStack = [];

    document
        .getElementById(
            "appLayer"
        )
        .classList.remove("show");

    document
        .getElementById(
            "homeScreen"
        )
        .style.display =
        "block";

    renderHome();

    updateHomePage();

}


function showRecent(){

    stopCamera();

    closeShade();

    const layer =
        document.getElementById(
            "recentLayer"
        );

    layer.classList.add("show");

    renderRecent();

}


function closeRecent(){

    document
        .getElementById(
            "recentLayer"
        )
        .classList.remove(
            "show"
        );

}


function renderRecent(){

    const list =
        document.getElementById(
            "recentList"
        );

    list.innerHTML = "";


    if(recentApps.length === 0){

        list.innerHTML =
            `
            <div class="card"
                 style="text-align:center;">
                沒有最近使用的 App
            </div>
            `;

        return;

    }


    recentApps.forEach(
        (id,index) => {

            const app =
                APPS[id];

            if(!app)
                return;


            const card =
                document.createElement(
                    "div"
                );

            card.className =
                "recent-card";


            card.innerHTML =
                `
                <div class="recent-card-name">
                    ${app.name}
                </div>

                <div class="recent-card-icon">
                    ${app.icon}
                </div>

                <button
                    class="recent-close">
                    ×
                </button>
                `;


            card.onclick = e => {

                if(
                    e.target.closest(
                        ".recent-close"
                    )
                )
                    return;

                closeRecent();

                openApp(id);

            };


            const close =
                card.querySelector(
                    ".recent-close"
                );

            close.onclick = e => {

                e.stopPropagation();

                recentApps.splice(
                    index,
                    1
                );

                renderRecent();

            };


            list.appendChild(card);

        }
    );

}

   MESSAGES
========================================================= */

function renderMessages(
    content,
    subPage=null
){

    if(currentChat){

        renderChatRoom(
            content
        );

        return;

    }


    content.innerHTML =
        `
        <div class="card">

            <div class="row-between">

                <div>
                    <div style="font-size:20px;font-weight:700;">
                        訊息
                    </div>

                    <div class="muted small"
                         style="margin-top:4px;">
                        與虛擬世界中的人聊天
                    </div>
                </div>

                <div style="font-size:25px;">
                    💬
                </div>

            </div>

        </div>
        `;


    data.chats.forEach(
        chat => {

            const last =
                chat.messages[
                    chat.messages.length-1
                ];


            const item =
                document.createElement(
                    "div"
                );

            item.className =
                "chat-item";


            item.innerHTML =
                `
                <div class="avatar">
                    ${chat.avatar}
                </div>

                <div class="chat-info">

                    <div class="chat-name">
                        ${chat.name}
                    </div>

                    <div class="chat-last">
                        ${escapeHTML(last?.text || "")}
                    </div>

                </div>

                <div class="chat-time">
                    ${last?.time || ""}
                </div>
                `;


            item.onclick = () => {

                currentChat =
                    chat.id;

                renderApp(
                    "messages"
                );

            };


            content.appendChild(
                item
            );

        }
    );

}


function renderChatRoom(
    content
){

    const chat =
        data.chats.find(
            c =>
                c.id === currentChat
        );

    if(!chat){

        currentChat = null;

        renderMessages(
            content
        );

        return;

    }


    const room =
        document.createElement(
            "div"
        );

    room.className =
        "chat-room";


    const list =
        document.createElement(
            "div"
        );

    list.className =
        "messages-list";


    chat.messages.forEach(
        message => {

            const bubble =
                document.createElement(
                    "div"
                );

            bubble.className =
                "message "+
                (
                    message.from === "me"
                        ? "me"
                        : "other"
                );

            bubble.textContent =
                message.text;

            list.appendChild(
                bubble
            );

        }
    );


    const inputRow =
        document.createElement(
            "div"
        );

    inputRow.className =
        "chat-input-row";


    inputRow.innerHTML =
        `
        <input
            class="chat-input"
            id="chatInput"
            placeholder="輸入訊息……">

        <button
            class="chat-send"
            onclick="sendMessage()">
            ↑
        </button>
        `;


    room.appendChild(list);

    room.appendChild(
        inputRow
    );

    content.appendChild(
        room
    );


    setTimeout(
        () => {

            list.scrollTop =
                list.scrollHeight;

        },
        10
    );


    const input =
        document.getElementById(
            "chatInput"
        );

    input.addEventListener(
        "keydown",
        e => {

            if(e.key === "Enter"){

                sendMessage();

            }

        }
    );

}


function sendMessage(){

    const input =
        document.getElementById(
            "chatInput"
        );

    if(!input)
        return;


    const text =
        input.value.trim();

    if(!text)
        return;


    const chat =
        data.chats.find(
            c =>
                c.id === currentChat
        );

    if(!chat)
        return;


    const now =
        new Date();

    const time =
        now.getHours()
        +":"
        +
        String(
            now.getMinutes()
        ).padStart(2,"0");


    chat.messages.push(
        {
            from:"me",
            text,
            time
        }
    );


    saveData();

    renderApp(
        "messages"
    );


    setTimeout(
        () => {

            const replies = [
                "嗯，我知道了。",
                "哈哈，好啊。",
                "晚點再聊。",
                "我剛好也在。",
                "收到。",
                "等一下。",
                "好喔。"
            ];

            const reply =
                replies[
                    Math.floor(
                        Math.random()
                        *
                        replies.length
                    )
                ];


            chat.messages.push(
                {
                    from:"other",
                    text:reply,
                    time
                }
            );


            addNotification(
                "💬",
                chat.name,
                reply
            );


            saveData();

            if(
                currentApp === "messages"
                &&
                currentChat === chat.id
            ){

                renderApp(
                    "messages"
                );

            }

        },
        1000+
        Math.random()*1800
    );

}

function renderCamera(

    content.innerHTML =
        `
        <div class="camera-box">

                autoplay
                playsinline>
            </video>

                    onclick="takePhoto()">
                </button>

            </div>

        </div>
        `;


    startCamera();

}


async function startCamera(){

    try{

        cameraStream =
            await navigator.mediaDevices
                .getUserMedia(
                    {
                        video:{
                            facingMode:"environment"
                        },
                        audio:false
                    }
                );


        const video =
            document.getElementById(
                "cameraVideo"
            );

        if(video){

            video.srcObject =
                cameraStream;

        }

    }catch(e){

        showToast(
            "無法開啟相機"
        );

    }

}


function stopCamera(){

    if(cameraStream){

        cameraStream
            .getTracks()
            .forEach(
                track =>
                track.stop()
            );

        cameraStream =
            null;

    }

}


function takePhoto(){

    const video =
        document.getElementById(
            "cameraVideo"
        );

    if(!video)
        return;


    const canvas =
        document.createElement(
            "canvas"
        );

    canvas.width =
        video.videoWidth ||
        640;

    canvas.height =
        video.videoHeight ||
        480;


    const ctx =
        canvas.getContext(
            "2d"
        );


    ctx.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
    );


    const image =
        canvas.toDataURL(
            "image/jpeg",
            .65
        );


    data.photos.unshift(
        image
    );

    data.photos =
        data.photos.slice(
            0,
            12
        );


    saveData();

    showToast(
        "照片已保存"
    );

}

let calcValue = "";


function renderCalculator(
    content
){

    content.innerHTML =
        `
        <div
            class="calc-display"
            id="calcDisplay">
            0
        </div>

        <div
            class="calc-grid"
            id="calcGrid">
        </div>
        `;


    const buttons = [
        "C","⌫","%","÷",
        "7","8","9","×",
        "4","5","6","−",
        "1","2","3","+",
        "0",".","=",
    ];


    const grid =
        document.getElementById(
            "calcGrid"
        );


    buttons.forEach(
        value => {

            const button =
                document.createElement(
                    "button"
                );

            button.className =
                "calc-btn";

            if(
                ["÷","×","−","+","="]
                    .includes(value)
            ){

                button.classList.add(
                    "operator"
                );

            }

            button.textContent =
                value;

            button.onclick =
                () =>
                calcPress(
                    value
                );

            grid.appendChild(
                button
            );

        }
    );

}


function calcPress(
value
){

    const display =
        document.getElementById(
            "calcDisplay"
        );

    if(!display)
        return;


    if(value === "C"){

        calcValue = "";

    }

    else if(value === "⌫"){

        calcValue =
            calcValue.slice(
                0,
                -1
            );

    }

    else if(value === "="){

        try{

            const expression =
                calcValue
                    .replaceAll("×","*")
                    .replaceAll("÷","/")
                    .replaceAll("−","-");

            if(
                !/^[0-9+\-*/%.() ]+$/
                    .test(expression)
            ){

                throw new Error();

            }

            const result =
                Function(
                    `"use strict";return (${expression})`
                )();

            calcValue =
                String(result);

        }catch(e){

            calcValue = "";

            display.textContent =
                "錯誤";

            return;

        }

    }

    else{

        calcValue +=
            value;

    }


    display.textContent =
        calcValue || "0";

}

    const target =
        document.getElementById(
            "gameTarget"
        );

    const score =
        document.getElementById(
            "gameScore"
        );

    if(!target || !score)
        return;


    score.textContent =
        gameScore;

    target.style.display =
        "flex";


    moveTarget();

}


function moveTarget(){

    const target =
        document.getElementById(
            "gameTarget"
        );

    if(!target)
        return;


    const box =
        target.parentElement;

    const maxX =
        box.clientWidth - 90;

    const maxY =
        box.clientHeight - 180;


    target.style.transform =
        `translate(
            ${Math.random()*maxX-maxX/2}px,
            ${Math.random()*maxY-maxY/2}px
        )`;


    gameTimer =
        setTimeout(
            moveTarget,
            1000
        );

}


function hitTarget(){

    gameScore++;

    const score =
        document.getElementById(
            "gameScore"
        );

    if(score){

        score.textContent =
            gameScore;

    }

    moveTarget();

}

========================================================= */

function unlock(){

    if(data.pin){

        document
            .getElementById(
                "pinScreen"
            )
            .classList.add(
                "show"
            );

        return;

    }


    document
        .getElementById(
            "lockScreen"
        )
        .classList.add(
            "unlocking"
        );


    setTimeout(
        () => {

            document
                .getElementById(
                    "lockScreen"
                )
                .style.display =
                "none";

        },
        500
    );

}


function pinInput(
number
){

    if(
        pinInputValue.length >= 4
    )
        return;


    pinInputValue +=
        number;

    updatePinDots();


    if(
        pinInputValue.length === 4
    ){

        setTimeout(
            checkPin,
            120
        );

    }

}


function updatePinDots(){

    const dots =
        document.querySelectorAll(
            ".pin-dot"
        );


    dots.forEach(
        (dot,index) => {

            dot.classList.toggle(
                "active",
                index <
                pinInputValue.length
            );

        }
    );

}


function pinBackspace(){

    pinInputValue =
        pinInputValue.slice(
            0,
            -1
        );

    updatePinDots();

}


function pinClear(){

    pinInputValue = "";

    updatePinDots();

}


function checkPin(){

    if(
        pinInputValue === data.pin
    ){

        document
            .getElementById(
                "pinScreen"
            )
            .classList.remove(
                "show"
            );

        document
            .getElementById(
                "lockScreen"
            )
            .classList.add(
                "unlocking"
            );


        pinInputValue = "";

        updatePinDots();

        setTimeout(
            () => {

                document
                    .getElementById(
                        "lockScreen"
                    )
                    .style.display =
                    "none";

            },
            500
        );

    }else{

        document
            .getElementById(
                "pinError"
            )
            .textContent =
            "密碼錯誤";

        pinInputValue = "";

        updatePinDots();

        setTimeout(
            () => {

                document
                    .getElementById(
                        "pinError"
                    )
                    .textContent =
                    "";

            },
            1200
        );

    }

}

/* =========================================================
   TOUCH GESTURES
========================================================= */

const phone =
    document.getElementById(
        "phone"
    );


phone.addEventListener(
    "touchstart",
    e => {

        const touch =
            e.touches[0];

        touchStartX =
            touch.clientX;

        touchStartY =
            touch.clientY;

        touchStartTime =
            Date.now();

    },
    {
        passive:true
    }
);


phone.addEventListener(
    "touchend",
    e => {

        const touch =
            e.changedTouches[0];

        const dx =
            touch.clientX -
            touchStartX;

        const dy =
            touch.clientY -
            touchStartY;

        const elapsed =
            Date.now() -
            touchStartTime;


        if(
            elapsed > 800
        )
            return;


        const absX =
            Math.abs(dx);

        const absY =
            Math.abs(dy);


        /* LOCK SCREEN */

        const lock =
            document.getElementById(
                "lockScreen"
            );


        const pin =
            document.getElementById(
                "pinScreen"
            );


        if(
            lock.style.display !== "none"
            &&
            !lock.classList.contains(
                "unlocking"
            )
            &&
            !pin.classList.contains(
                "show"
            )
        ){

            if(
                dy < -80
            ){

                unlock();

                return;

            }

        }


        /* SHADE */

        if(
            dy > 90 &&
            touchStartY < 55
        ){

            openShade();

            return;

        }


        if(
            dy < -70 &&
            touchStartY < 300 &&
            document
                .getElementById(
                    "shade"
                )
                .classList.contains(
                    "show"
                )
        ){

            closeShade();

            return;

        }


        /* RECENT */

        if(
            dy < -100 &&
            touchStartY > 700
        ){

            showRecent();

            return;

        }


        /* HOME PAGE */

        if(
            currentApp === null &&
            !document
                .getElementById(
                    "recentLayer"
                )
                .classList.contains(
                    "show"
                )
        ){

            if(
                absX > 70 &&
                absX > absY
            ){

                if(dx < 0){

                    currentPage =
                        Math.min(
                            1,
                            currentPage+1
                        );

                }else{

                    currentPage =
                        Math.max(
                            0,
                            currentPage-1
                        );

                }

                updateHomePage();

            }

        }

    },
    {
        passive:true
    }
);


/* =========================================================
   DESKTOP MOUSE SWIPE SUPPORT
========================================================= */

let mouseStartX = 0;
let mouseStartY = 0;


phone.addEventListener(
    "mousedown",
    e => {

        mouseStartX =
            e.clientX;

        mouseStartY =
            e.clientY;

    }
);


phone.addEventListener(
    "mouseup",
    e => {

        const dx =
            e.clientX -
            mouseStartX;

        const dy =
            e.clientY -
            mouseStartY;


        if(
            currentApp === null &&
            Math.abs(dx) > 80 &&
            Math.abs(dx) > Math.abs(dy)
        ){

            if(dx < 0){

                currentPage =
                    Math.min(
                        1,
                        currentPage+1
                    );

            }else{

                currentPage =
                    Math.max(
                        0,
                        currentPage-1
                    );

            }

            updateHomePage();

        }

    }
);

/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(
text
){

    return String(text)
        .replaceAll(
            "&",
            "&amp;"
        )
        .replaceAll(
            "<",
            "&lt;"
        )
        .replaceAll(
            ">",
            "&gt;"
        )
        .replaceAll(
            '"',
            "&quot;"
        )
        .replaceAll(
            "'",
            "&#039;"
        );

}
